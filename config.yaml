version: 1.2.8
cache: true
fileStrategy: s3
interface:
  customWelcome: Bem vindo ao Chat Lendário! Divirta-se!
  mcpServers:
    placeholder: MCP Servers
  fileSearch: true
  privacyPolicy:
    externalUrl: https://chat.superagentes.ai/privacy-policy
    openNewTab: true
  termsOfService:
    externalUrl: https://chat.superagentes.ai/tos
    openNewTab: true
    modalAcceptance: true
    modalTitle: Termos de Uso e Política de Privacidade - Chat Lendário
    modalContent: >
      # Termos de Uso e Política de Privacidade

      *Data de Vigência: Agosto de 2025*


      Bem-vindo à Chat Lendário, plataforma para criação uso de modelos selecionados e criação de agentes, disponível em
      https://chat.superagentes.ai. Estes Termos de Uso e Política de Privacidade ("Termos") regem o uso de nossos
      serviços. Ao acessar ou utilizar a Plataforma, você concorda em estar vinculado a estes Termos.


      ## 1. Sobre a Empresa

      A plataforma é operada pela Academia de Lendários LTDA, inscrita no CNPJ 37.348.342/0001-07, comprometida com a
      proteção de dados conforme a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018).


      ## 2. Uso da Plataforma

      A Chat Lendário é projetada para transformar atendimento, vendas e suporte com agentes de IA personalizados.
      Qualquer uso indevido ou ilícito da Plataforma é expressamente proibido. Os usuários devem utilizar os serviços de
      forma ética e em conformidade com a legislação aplicável.


      ## 3. Propriedade Intelectual

      Todo conteúdo da Plataforma, incluindo textos, gráficos, logos, ícones e documentos, são de propriedade exclusiva
      da Chat Lendário ou de seus licenciantes, protegidos pelas leis de direitos autorais e propriedade intelectual.


      ## 4. Política de Reembolso

      Em conformidade com o Código de Defesa do Consumidor, você tem direito ao reembolso integral no prazo de 7 dias
      corridos da compra, sem necessidade de justificativa. O reembolso será processado em até 10 dias úteis pelo mesmo
      método de pagamento original.


      ## 5. Coleta e Uso de Dados

      Coletamos dados essenciais para prestação dos serviços: dados cadastrais (nome, e-mail, telefone), dados de uso
      (interações com agentes), dados financeiros (pagamentos), dados de usuários finais (interações via WhatsApp e
      outros canais), dados de autenticação (tokens de acesso) e dados de treinamento (para personalização de LLMs).


      ## 6. Finalidade do Tratamento

      Os dados são utilizados para: operação do serviço, melhoria dos serviços, comunicação com cliente, cumprimento de
      obrigações legais, análise e relatórios, e treinamento de modelos de linguagem (LLMs) para personalização.


      ## 7. Direitos dos Usuários

      Conforme a LGPD, você tem direito a: confirmação de tratamento de dados, acesso aos dados, correção de dados
      incorretos, anonimização/bloqueio/eliminação de dados desnecessários, portabilidade dos dados, revogação do
      consentimento e informações sobre uso em treinamento de LLMs. Para exercer estes direitos, contate:
      contato@superagentes.ai.


      ## 8. Compartilhamento de Dados

      Dados podem ser compartilhados com: prestadores de serviços terceirizados, autoridades regulatórias (quando
      exigido por lei), clientes do serviço (relatórios de desempenho), integrações autorizadas (WhatsApp, etc.) e
      provedores de LLMs (GPT-4o Turbo, Claude 3 Opus, etc.). Dados do Google Workspace são processados exclusivamente
      para personalização individual, nunca para treinamento de modelos generalizados.


      ## 9. Segurança dos Dados

      Implementamos medidas avançadas de segurança: criptografia de dados sensíveis, controle de acesso limitado,
      monitoramento contínuo, tokens seguros para autenticação, armazenamento seguro de chaves de API e anonimização de
      dados no treinamento de LLMs sempre que possível.


      ## 10. Retenção de Dados

      Mantemos dados pelo tempo necessário conforme o plano contratado: conversas e interações (conforme plano
      escolhido), dados de conta (enquanto ativa), logs e auditoria (até 90 dias), dados de treinamento de LLMs (período
      necessário para treinamento com anonimização quando possível).


      ## 11. Transferências Internacionais

      Dados podem ser transferidos para o exterior para cumprimento dos serviços (ex: servidores em nuvem), sempre
      observando o mesmo nível de proteção da LGPD e estabelecendo contratos que respeitem esta Política de Privacidade.


      ## 12. Lei Aplicável

      Estes Termos são regidos pela Lei nº 13.853 e pelo Código Civil Brasileiro. Disputas serão resolvidas no foro da
      sede da Academia de Lendários LTDA.


      ## 13. Alterações nos Termos

      Reservamos o direito de alterar estes Termos a qualquer momento. Usuários serão notificados sobre alterações
      significativas via plataforma ou e-mail. O uso contínuo após as alterações indica consentimento com os termos
      atualizados.


      ## 14. Informações de Contato

      Para dúvidas sobre estes Termos, tratamento de dados ou uso de LLMs, entre em contato: contato@superagentes.ai ou
      suporte@superagentes.ai.


      Ao utilizar a Plataforma, você reconhece ter lido estes Termos de Uso e Política de Privacidade e concorda em
      estar vinculado a eles.
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
registration:
  socialLogins:
    - github
    - google
    - discord
    - openid
    - facebook
    - apple
    - saml
actions:
  allowedDomains:
    - swapi.dev
    - chat.superagentes.ai
    - google.com
endpoints:
  openAI:
    titleConvo: true
    titleModel: gpt-4o-mini
    titleMethod: completion
    titlePrompt: >-
      Forneça um título conciso em português brasileiro, com no máximo 5 palavras, sem pontuação ou aspas. Apenas o
      título.


      Conversa:

      {convo}
  custom:
    - name: xAI
      apiKey: ${XAI_API_KEY}
      baseURL: https://api.x.ai/v1
      models:
        default:
          - grok-3
          - grok-4
          - grok-4-0709
          - grok-4-latest
          - grok-4-fast-reasoning-latest
          - grok-4.3
        fetch: false
      titleConvo: true
      titleModel: grok-3
      summarize: true
      summaryModel: grok-3
      forcePrompt: false
      modelDisplayLabel: xAI
    - name: deepSeek
      apiKey: ${DEEPSEEK_API_KEY}
      baseURL: https://api.deepseek.com/v1
      models:
        default:
          - deepseek-v4-pro
          - deepseek-flash
        fetch: true
      titleConvo: true
      titleModel: deepseek-chat
      modelDisplayLabel: DeepSeek
      summarize: true
      summaryModel: deepseek-chat
      titleMethod: completion
      titlePrompt: >-
        Forneça um título conciso em português brasileiro, com no máximo 5 palavras, sem pontuação ou aspas. Apenas o
        título.


        Conversa:

        {convo}
    - name: groq
      apiKey: ${GROQ_API_KEY}
      baseURL: https://api.groq.com/openai/v1/
      models:
        default:
          - llama3-70b-8192
          - llama3-8b-8192
          - llama2-70b-4096
          - mixtral-8x7b-32768
          - gemma-7b-it
        fetch: false
      titleConvo: true
      titleModel: mixtral-8x7b-32768
      modelDisplayLabel: groq
      summarize: true
      summaryModel: llama3-8b-8192
    - name: Mistral
      apiKey: ${MISTRAL_API_KEY}
      baseURL: https://api.mistral.ai/v1
      models:
        default:
          - mistral-tiny
          - mistral-small
          - mistral-medium
        fetch: true
      titleConvo: true
      titleModel: mistral-tiny
      summarize: true
      summaryModel: mistral-tiny
      modelDisplayLabel: Mistral
      dropParams:
        - stop
        - user
        - frequency_penalty
        - presence_penalty
    - name: OpenRouter
      apiKey: ${OPENROUTER_KEY}
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - anthropic/claude-sonnet-4.5
          - openai/gpt-5-mini
          - anthropic/claude-haiku-4.5
          - deepseek/deepseek-v4-flash
        fetch: true
      titleConvo: true
      titleModel: openai/gpt-4o-mini
      dropParams:
        - stop
      modelDisplayLabel: AI
      iconURL: anthropic
      summarize: true
      summaryModel: current_model
    - name: Portkey
      apiKey: dummy
      baseURL: https://api.portkey.ai/v1
      headers:
        x-portkey-api-key: ${PORTKEY_API_KEY}
        x-portkey-virtual-key: ${PORTKEY_OPENAI_VIRTUAL_KEY}
      models:
        default:
          - gpt-4o-mini
          - gpt-4o
          - chatgpt-4o-latest
        fetch: true
      titleConvo: true
      titleModel: current_model
      summarize: true
      summaryModel: current_model
      forcePrompt: false
      modelDisplayLabel: Portkey
      iconURL: https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/rjqy7ghvjoiu4cd1xjbf
  all:
    titleConvo: true
    titleEndpoint: openAI
    titleModel: gpt-4o-mini
    titleMethod: completion
    titlePrompt: >-
      Forneça um título conciso em português brasileiro, com no máximo 5 palavras, sem pontuação ou aspas. Apenas o
      título.

      Conversa: {convo}
fileConfig:
  endpoints:
    default:
      totalSizeLimit: 95
webSearch:
  serperApiKey: ${SERPER_API_KEY}
  searchProvider: serper
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  scraperType: firecrawl
  cohereApiKey: ${COHERE_API_KEY}
  rerankerType: cohere
  scraperTimeout: 7500
  safeSearch: 1
rateLimits:
  messagesByModel:
    gpt-5:
      userMax: 840
      userWindowInMinutes: 10080
    gpt-5.1:
      userMax: 840
      userWindowInMinutes: 10080
    claude-sonnet-4:
      userMax: 630
      userWindowInMinutes: 10080
  inputTokensByConversation:
    userMax: 150000
    models:
      - claude-sonnet-4
      - gpt-5
      - gpt-5.1
  conversationTokens:
    userMax: 150000
    models:
      - gpt-5
      - gpt-5.1
      - claude-sonnet-4
